name: Build and publish Tailspace extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "extension/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build extension APK
        run: ./gradlew :extension:assembleDebug

      - name: Generate repository index
        run: python3 scripts/make_index.py

      - name: Verify repository output
        run: |
          test -f repo/index.json
          test -f repo/index.min.json
          test -f repo/apk/tachiyomi-en.tailspace-v1.6.3.apk
          python3 -m json.tool repo/index.min.json >/dev/null
          find repo -maxdepth 3 -type f -print

      - name: Publish repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
          force_orphan: true
          enable_jekyll: false
