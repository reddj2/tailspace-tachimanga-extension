name: Build Tailspace extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Keiyoushi build system
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1

      - name: Add Tailspace module
        run: |
          mkdir -p upstream/src/en/tailspace
          cp -R extension/. upstream/src/en/tailspace/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: upstream
        run: ./gradlew :src:en:tailspace:assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p repo/apk
          APK=$(find upstream/src/en/tailspace/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" repo/apk/tachiyomi-en.tailspace-v1.4.1.apk

      - name: Generate Tachimanga index
        run: python3 scripts/make_index.py

      - name: Publish repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
          force_orphan: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailspace-extension
          path: repo/
